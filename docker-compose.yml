services:
  postgres:
    image: postgres:16-alpine
    container_name: service-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_platform
      POSTGRES_USER: service_platform
      POSTGRES_PASSWORD: service_platform
    ports:
      - "55432:5432"
    volumes:
      - service_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_platform -d service_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: service-platform-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/service_platform
      DATABASE_USERNAME: service_platform
      DATABASE_PASSWORD: service_platform
      JWT_SECRET: docker-dev-secret-change-me-in-prod-0123456789
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: "-Xmx512m"
    ports:
      - "58080:8080"

  frontend:
    build: ./frontend
    container_name: service-platform-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  service_platform_pgdata:
