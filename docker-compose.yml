services:
  postgres:
    image: postgres:16-alpine
    container_name: service-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_platform
      POSTGRES_USER: service_platform
      POSTGRES_PASSWORD: service_platform
    ports:
      # Host port 55432 (not 5432) — this machine already runs native
      # PostgreSQL services (v13 and v18) bound to 5432/5433, which silently
      # shadow a container also mapped to one of those ports on localhost.
      - "55432:5432"
    volumes:
      - service_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_platform -d service_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  service_platform_pgdata:
