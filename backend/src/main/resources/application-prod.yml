# Production profile: no insecure fallbacks. Every value below MUST come from a real
# environment variable; if one is missing, application startup fails fast rather than
# silently running with a dev secret.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.platform: INFO
    root: WARN
