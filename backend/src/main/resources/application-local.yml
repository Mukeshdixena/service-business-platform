spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/service_platform}
    username: ${DATABASE_USERNAME:service_platform}
    password: ${DATABASE_PASSWORD:service_platform}
  jpa:
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}

logging:
  level:
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG
